server:
  port: 8092

spring:
  application:
    name: MISSION-REGISTRY-SERVICE

  datasource:
    url: jdbc:postgresql://localhost:6001/integration_db?options=-c%20TimeZone=UTC
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379
